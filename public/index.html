<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Casino Wear — Aktywacja zegarka</title>
  <link rel="stylesheet" href="/activate/style.css">
  <script src="/activate/activate.js" defer></script>
</head>
<body>
  <div class="layout">
    <main class="card">
      <span class="eyebrow">CASINO WEAR · AUTORYZACJA ZEGARKA</span>
      <h1>Połącz swój zegarek</h1>
      <p>Wpisz 8-znakowy kod widoczny na ekranie zegarka, aby zalogować go na swoje konto.</p>
      <form id="form">
        <label>Kod z zegarka
          <input name="code" placeholder="ABCD-EFGH" autocomplete="off" maxlength="9" required>
        </label>
        <label>Nick gracza (3–12 znaków)
          <input name="nick" autocomplete="username" maxlength="12" required>
        </label>
        <label>Hasło (min. 10 znaków dla nowego konta)
          <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
        </label>
        <label>Operacja
          <select name="mode">
            <option value="login">Zaloguj istniejące konto</option>
            <option value="register">Utwórz nowe konto</option>
          </select>
        </label>
        <details>
          <summary>Zmiana hasła istniejącego konta</summary>
          <label>Nowe hasło (opcjonalnie)
            <input name="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128">
          </label>
        </details>
        <button type="submit">Zatwierdź mój zegarek</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>
</body>
</html>
